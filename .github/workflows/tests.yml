# Run the suite on every push and pull request.
#
# Auvren targets Windows, so the suite runs on Windows as well as on Ubuntu.
# Every Win32 call is faked at a seam (winplat.py) and every subprocess
# (piper, powershell, taskkill, wt, claude) is faked in tests, so both are
# meaningful. The Windows job is `continue-on-error` for now: the suite was
# written on macOS and some tests still assume POSIX (file modes, symlinks,
# `/` paths). Its failures are the Windows port's to-do list, not noise —
# once it is green, drop `continue-on-error` and make it the required job.
#
# The suite needs: Python 3.11+, Node for the frontend build that
# tests/test_dashboard_page.py drives, and Playwright's Chromium for the same
# test plus read_page / look_at_page. It does NOT need a voice, a Claude
# login, or the network: `pytest.ini` deselects the browser-integration
# tests, and everything else runs offline.

name: tests

on:
  push:
  pull_request:
  # Run it by hand from the Actions tab, without pushing anything.
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Test suite
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
        run: pytest -v -o faulthandler_timeout=300 -p no:cacheprovider
